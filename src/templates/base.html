{{define "base"}}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yasmim Magalhães</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css"
        integrity="sha512-d0olNN35C6VLiulAobxYHZiXJmq+vl+BGIgAxQtD5+kqudro/xNMvv2yIHAciGHpExsIbKX3iLg+0B6d0k4+ZA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css"
        integrity="sha512-8RxmFOVaKQe/xtg6lbscU9DU0IRhURWEuiI0tXevv+lXbAHfkpamD4VKFQRto9WgfOJDwOZ74c/s9Yesv3VvIQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css"
        integrity="sha512-pZlKGs7nEqF4zoG0egeK167l6yovsuL8ap30d07kA5AJUq+WysFlQ02DLXAmN3n0+H3JVz5ni8SJZnrOaYXWBA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/static/dist/css/mystyles.css">
    <link rel="icon" type="image/x-icon" href="/static/dist/Logo02.png">
    <script defer src="/static/dist/js/bundle.js"></script>
</head>

<body class="has-background-white-ter"></body>

<div id="wrapper" class="hero is-fullheight" x-data="app" @scroll.window="showElement()">

    <header class="hero-head is-primary has-background-white-bis is-hidden-touch">
        <div class="container is-max-widescreen py-6">
            <nav class="navbar" role="navigation" aria-label="main navigation">
                <div class="navbar-brand">
                    <a class="navbar-item" href="/">
                        <img src="/static/dist/Logo02.png" width="28" height="28">
                    </a>
                </div>

                <div id="navbarBasicExample" class="navbar-menu">

                    <div class="navbar-start has-text-weight-light is-size-5-tablet">
                        <a class="navbar-item" href="#sobre-mim">Sobre mim</a>
                        <a class="navbar-item" href="#abordagem">Abordagem</a>
                        <a class="navbar-item" href="#servicos">Serviços</a>
                        <a class="navbar-item" href="#academico">Supervisão clínica</a>
                        <a class="navbar-item" href="#academico">Cursos de extensão</a>
                    </div>

                    <div class="navbar-end">
                        <div class="navbar-item">
                            <div class="tags has-addons">
                                <span class="tag is-rounded is-medium">
                                    <span class="icon">
                                        <i class="fa-solid fa-phone"></i>
                                    </span>
                                </span>
                                <span class="tag is-rounded is-medium has-text-weight-light">+55 (61)
                                    99376-7802</span>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

        </div>

    </header>

    <main class="hero-body">
        {{template "body" .}}
    </main>

    <footer class="hero-footer has-background-white-bis">
        <section class="section has-text-centered">
            <span class="icon-text">
                <span class="icon">
                    <i class="fa-solid fa-copyright"></i>
                </span>
                <span>
                    Yasmim Magalhães
                </span>
            </span>

        </section>
    </footer>

</div>
</body>

</html>
{{end}}
